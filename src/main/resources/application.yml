spring:
  application:
    name: wire

  kafka:
    # No default — the app must fail fast if these aren't set, rather than
    # silently pointing at nothing. See docs/adr/001-stack-and-broker.md.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:wire-consumer}

wire:
  topics:
    raw: wire.transactions.raw
    raw-partitions: 3
    dlq: wire.transactions.dlq
    dlq-partitions: 1
  consumer:
    # Matches raw-partitions above — one consumer thread per partition, so
    # concurrent multi-partition consumption is actually exercised instead
    # of one thread serializing every partition. See docs/RISKS.md.
    concurrency: 3
  ledger:
    # The base URL of the LEDGER instance this consumer posts to.
    base-url: ${LEDGER_BASE_URL}
    # Without these, a hung LEDGER instance blocks the consumer thread
    # indefinitely instead of ever surfacing as a retryable transient
    # failure. See docs/RISKS.md.
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
  producer:
    # No default — POST /events must fail fast without a real key rather
    # than accept unauthenticated traffic. See docs/RISKS.md.
    api-key: ${WIRE_PRODUCER_API_KEY}

server:
  port: 8081
